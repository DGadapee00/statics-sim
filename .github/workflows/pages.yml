# Builds the site and publishes it to GitHub Pages, so the app is a link instead of an install.
#
# This workflow does nothing until Pages is switched on for the repository:
# Settings → Pages → Build and deployment → Source: GitHub Actions.
# Until then it will fail with "Pages is not enabled", which is harmless.
#
# Note: a GitHub Pages site is world-readable. See DEPLOY.md before turning this on.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The physics self-test and the problem-bank checker. A build that fails these
      # would publish wrong answers, which is worse than publishing nothing.
      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="en" data-course="statics">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This course has moved</title>
<noscript><meta http-equiv="refresh" content="0; url=https://flux-study.pages.dev/statics/"></noscript>
<style>body { font: 16px/1.45 system-ui, sans-serif; margin: 2rem; } a { color: inherit; }</style>
<script>
  var course = document.documentElement.getAttribute('data-course');
  var next = 'https://flux-study.pages.dev/' + course + '/' + location.hash;
  document.write('<meta http-equiv="refresh" content="0; url=' + next + '">');
  document.write('<p><a href="' + next + '">This course has moved.</a></p>');
  location.replace(next);
</script>
</head>
<body>
<noscript><p><a href="https://flux-study.pages.dev/statics/">This course has moved.</a></p></noscript>
</body>
</html>
